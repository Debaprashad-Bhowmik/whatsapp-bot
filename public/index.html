<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <!-- Status Panel -->
        <div class="glass-panel status-panel">
            <div class="status-header">
                <h2>Connection Status</h2>
                <div id="status-indicator" class="pulse-dot starting"></div>
            </div>
            
            <div id="status-content" class="status-content">
                <p id="status-text">Booting up system...</p>
                <!-- QR Code will be injected here -->
            </div>
        </div>

        <!-- Control Panel -->
        <div class="glass-panel control-panel">
            <h2>Bot Configuration</h2>
            
            <form id="config-form">
                <div class="form-group">
                    <label for="targetNumber">Target Phone Number</label>
                    <input type="text" id="targetNumber" placeholder="e.g., 8801847101102" required>
                    <small>Include country code without '+'. Do not add '@s.whatsapp.net'.</small>
                </div>

                <div class="form-group">
                    <label for="message">Message Text</label>
                    <textarea id="message" rows="3" placeholder="Type your automated message here..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="intervalHours">Interval (Hours)</label>
                    <input type="number" id="intervalHours" min="1" max="72" required>
                </div>

                <div class="form-group switch-group">
                    <label for="isActive">Master Switch</label>
                    <label class="switch">
                        <input type="checkbox" id="isActive">
                        <span class="slider round"></span>
                    </label>
                </div>

                <button type="submit" id="save-btn" class="save-btn">
                    <span class="btn-text">Save Settings</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
